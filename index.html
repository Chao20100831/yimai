<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘小面包 | 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        /* 页面淡入动画 */
        body {
            background-color: #fef7f0;
            padding: 30px 15px;
            text-align: center;
            /* 淡入效果 */
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #7b3f22;
            margin-bottom: 24px;
            font-size: 2.2rem;
        }
        .poster-img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            margin-bottom: 32px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a.button {
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.25s ease; /* 过渡：让hover、按下效果顺滑 */
        }
        .btn-menu {
            background-color: #8b5a3c;
            color: white;
        }
        .btn-book {
            background-color: #d48b64;
            color: white;
        }
        /* 悬浮上浮效果 */
        a.button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
        }
        /* 点击按下效果，提升手感 */
        a.button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>神秘小面包</h1>
        <img class="poster-img" src="img/manue.png" alt="神秘小面包菜单海报">
        <div class="btn-group">
            <!-- 填入你另外两个仓库的Pages地址 -->
            <a class="button btn-menu" href="https://yimai.github.io/menu/" target="_blank">菜单</a>
            <a class="button btn-book" href="https://yimai.github.io/book/" target="_blank">预定/沟通</a>
        </div>
    </div>
</body>
</html>
