<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘小面包 | 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #fef7f0;
            padding: 30px 15px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #7b3f22;
            margin-bottom: 24px;
            font-size: 2.2rem;
        }
        .poster-img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            margin-bottom: 32px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a.button {
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.25s;
        }
        .btn-menu {
            background-color: #8b5a3c;
            color: white;
        }
        .btn-book {
            background-color: #d48b64;
            color: white;
        }
        a.button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>神秘小面包</h1>
        <!-- 把图片上传到这个仓库，替换 src 为图片路径 -->
        <img class="poster-img" src="manue.png" alt="神秘小面包菜单海报">
        <div class="btn-group">
            <!-- ========== 修改这里！替换成你【菜单仓库】的 GitHub Pages 地址 ========== -->
            <a class="button btn-menu" href="https://你的用户名.github.io/menu-repo/" target="_blank">菜单</a>
            <!-- ========== 修改这里！替换成你【预定沟通仓库】的 GitHub Pages 地址 ========== -->
            <a class="button btn-book" href="https://你的用户名.github.io/book-repo/" target="_blank">预定/沟通</a>
        </div>
    </div>
</body>
</html>
